    get:
      operationId: listSSHBans
      tags: [system]
      x-permission: system.read
      x-token: true
      summary: Active SSH source bans (fail2ban-style protection of the agent SSH port, HP-SSH-026).
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/SSHBan"}}}}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/ssh-bans/{id}:
    delete:
      operationId: liftSSHBan
      tags: [system]
      x-permission: system.settings
      x-reauth: true
      summary: Lift a ban early (audited). The source's offense count is kept.
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "204": {description: lifted}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/system/gateway-host-keys:
    get:
      operationId: listGatewayHostKeys
      tags: [system]
      x-permission: dashboard.view
      x-token: true
      summary: Public gateway host keys for agent known_hosts pinning (not secret).
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/GatewayHostKey"}}}}}}}
  /api/v1/stats/overview:
    get:
      operationId: getStatsOverview
      tags: [system]
      x-permission: dashboard.view
      x-token: true
      parameters:
        - {name: range, in: query, schema: {type: string, enum: [24h, 7d, 30d], default: 24h}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/StatsOverview"}}}}
        default: {$ref: "#/components/responses/Problem"}

  # ---------------------------------------------------------------- live
  /api/v1/events:
    get:
      operationId: streamEvents
      tags: [live]
      x-permission: session
      x-stream: true
      summary: Server-Sent Events filtered per subscriber (PLAN §8.3).
      parameters:
        - {name: Last-Event-ID, in: header, schema: {type: string}}
      responses:
        "200": {description: event stream, content: {text/event-stream: {schema: {type: string}}}}

components:
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, maxLength: 64}}
    Token: {name: token, in: path, required: true, schema: {type: string, maxLength: 128}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 256}}
  responses:
    Problem:
      description: error
      content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string, description: "stable machine-readable code, e.g. forbidden, not_found, conflict, reauth_required, mfa_required, rate_limited, validation_failed"}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items: {type: object, required: [field, message], properties: {field: {type: string}, message: {type: string}}}
    Timestamp: {type: string, format: date-time}
    NullableTimestamp: {type: [string, "null"], format: date-time}
    StringMap: {type: [object, "null"], additionalProperties: {type: string}}
    StringList: {type: [array, "null"], items: {type: string}}
    AuthConfig:
      type: object
      required: [local_login, providers, bootstrap_required]
      properties:
        local_login: {type: boolean}
        bootstrap_required: {type: boolean}
        providers:
          type: array
          items: {type: object, required: [slug, display_name], properties: {slug: {type: string}, display_name: {type: string}}}
    LoginRequest:
      type: object
      required: [email, password]
      properties: {email: {type: string}, password: {type: string, writeOnly: true}}
    LoginResult:
      type: object
      required: [mfa_pending, must_enroll, me]
      properties: {mfa_pending: {type: boolean}, must_enroll: {type: boolean}, me: {$ref: "#/components/schemas/Me"}}
    CodeRequest:
      type: object
      required: [code]
      properties: {code: {type: string, description: TOTP or recovery code}}
    ReauthRequest:
      type: object
      required: [password]
      properties: {password: {type: string, writeOnly: true}, code: {type: string}}
    LogoutResult:
      type: object
      required: [provider_logout_url]
      properties: {provider_logout_url: {type: [string, "null"], description: optional RP-initiated logout at the IdP (not a global logout)}}
    BootstrapRequest:
      type: object
      required: [token, email, display_name, password]
      properties: {token: {type: string}, email: {type: string}, display_name: {type: string}, password: {type: string, writeOnly: true}}
    AcceptInvitationRequest:
      type: object
      required: [display_name, password]
      properties: {display_name: {type: string}, password: {type: string, writeOnly: true}}
    PasswordRequest:
      type: object
      required: [password]
      properties: {password: {type: string, writeOnly: true}}
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties: {current_password: {type: string, writeOnly: true}, new_password: {type: string, writeOnly: true}}
    ReasonRequest:
      type: object
      properties: {reason: {type: string, maxLength: 1000}}
    RecoverRequest:
      type: object
      required: [token]
      properties: {token: {type: string, writeOnly: true}}
    RecoverResult:
      type: object
      required: [must_enroll, password_reset, me]
      properties:
        must_enroll: {type: boolean, description: the session is limited until a TOTP factor is enrolled}
        password_reset:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/OneTimeToken"}
        me: {$ref: "#/components/schemas/Me"}
    OneTimeToken:
      type: object
      required: [token, expires_at]
      properties: {token: {type: string}, expires_at: {$ref: "#/components/schemas/Timestamp"}, url: {type: string}}
    TOTPEnrollment:
      type: object
      required: [secret, uri]
      properties: {secret: {type: string}, uri: {type: string}}
    RecoveryCodes:
      type: object
      required: [codes]
      properties: {codes: {type: array, items: {type: string}}}
    Me:
      type: object
      required: [operator, permissions, session, csrf_token]
      properties:
        operator: {$ref: "#/components/schemas/Operator"}
        permissions: {type: array, items: {type: string}}
        csrf_token: {type: string}
        session:
          type: object
          required: [id, method, auth_at, expires_at, limited, needs_enroll]
          properties:
            id: {type: string}
            method: {type: string, enum: [password, oidc, breakglass]}
            auth_at: {$ref: "#/components/schemas/Timestamp"}
            mfa_at: {$ref: "#/components/schemas/NullableTimestamp"}
            expires_at: {$ref: "#/components/schemas/Timestamp"}
            limited: {type: boolean}
            needs_enroll: {type: boolean}
    APIToken:
      type: object
      required: [id, name, operator_id, role, hint, created_at, never_expires]
      properties:
        id: {type: string}
        name: {type: string}
        operator_id: {type: string, description: The operator the token acts for.}
        role: {type: string, enum: [administrator, approver, auditor, viewer]}
        hint: {type: string, description: Last four characters of the token, to recognize it.}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: Absent when the token never expires.
        never_expires: {type: boolean}
        last_used_at: {$ref: "#/components/schemas/Timestamp"}
        last_used_ip: {type: string}
        revoked_at: {$ref: "#/components/schemas/Timestamp"}
        revoked_by: {type: string}
    APITokenInput:
      type: object
      required: [name, role]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        role: {type: string, enum: [administrator, approver, auditor, viewer]}
        expires_in_days: {type: integer, minimum: 1, maximum: 366, description: Required unless never_expires is set.}
        never_expires:
          type: boolean
          description: >-
            Issue a token without expiry, for Terraform and break-glass automation. It still stops when it is revoked or
            when its operator is disabled or loses the role. Omit expires_in_days.
    APITokenCreated:
      type: object
      required: [token, api_token]
      properties:
        token: {type: string, description: "hallpass_at_…; shown only in this response."}
        api_token: {$ref: "#/components/schemas/APIToken"}
    Operator:
      type: object
      required: [id, display_name, enabled, provisioned_via, roles, role_assignments, groups, has_password, mfa_enrolled, mfa_required, version, created_at]
      properties:
        id: {type: string}
        email: {type: string}
        display_name: {type: string}
        enabled: {type: boolean}
        provisioned_via: {type: string}
        roles: {type: array, items: {type: string, enum: [administrator, approver, auditor, viewer]}}
        role_assignments:
          type: [array, "null"]
          items: {type: object, required: [role, source], properties: {role: {type: string}, source: {type: string, enum: [manual, sso]}, source_ref: {type: string}}}
        groups: {$ref: "#/components/schemas/StringList"}
        has_password: {type: boolean}
        mfa_enrolled: {type: boolean}
        mfa_required: {type: boolean}
        version: {type: integer}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        last_login_at: {$ref: "#/components/schemas/Timestamp"}
    OperatorCreate:
      type: object
      required: [email, display_name]
      properties:
        email: {type: string}
        display_name: {type: string}
        roles: {type: array, items: {type: string}}
        mfa_required: {type: boolean}
    OperatorPatch:
      type: object
      properties:
        roles: {type: array, items: {type: string}, description: manual roles (SSO-mapped roles are managed by the provider)}
        enabled: {type: boolean}
        groups: {type: array, items: {type: string}}
    Invitation:
      type: object
      required: [id, email, roles, expires_at, created_at, created_by]
      properties:
        id: {type: string}
        email: {type: string}
        roles: {type: array, items: {type: string}}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        created_by: {type: string}
    InvitationCreate:
      type: object
      required: [email]
      properties: {email: {type: string}, roles: {type: array, items: {type: string}}}
    WebSession:
      type: object
      required: [id, auth_method, created_at, last_seen_at, expires_at, ip, user_agent, current]
      properties:
        id: {type: string}
        auth_method: {type: string}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        last_seen_at: {$ref: "#/components/schemas/Timestamp"}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
        ip: {type: string}
        user_agent: {type: string}
        current: {type: boolean}
    Identity:
      type: object
      required: [issuer, subject, provider_id, operator_id, linked_via, created_at]
      properties:
        issuer: {type: string}
        subject: {type: string}
        provider_id: {type: string}
        operator_id: {type: string}
        linked_via: {type: string}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        last_login_at: {$ref: "#/components/schemas/NullableTimestamp"}
    IdentityLink:
      type: object
      required: [provider_id, subject]
      properties: {provider_id: {type: string}, subject: {type: string}}
    Agent:
      type: object
      required: [id, name, description, enabled, source_cidrs, groups, labels, version, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        source_cidrs: {$ref: "#/components/schemas/StringList"}
        groups: {$ref: "#/components/schemas/StringList"}
        labels: {$ref: "#/components/schemas/StringMap"}
        version: {type: integer}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        created_by: {type: string}
        updated_at: {$ref: "#/components/schemas/Timestamp"}
        updated_by: {type: string}
        disabled_at: {$ref: "#/components/schemas/Timestamp"}
        deleted_at: {allOf: [{$ref: "#/components/schemas/Timestamp"}], description: "Set when the agent was deleted; name is then the name it had."}
    AgentDetail:
      allOf:
        - {$ref: "#/components/schemas/Agent"}
        - type: object
          required: [keys]
          properties: {keys: {type: array, items: {$ref: "#/components/schemas/AgentKey"}}}
    AgentCreate:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        source_cidrs: {type: array, items: {type: string}}
        groups: {type: array, items: {type: string}}
        labels: {type: object, additionalProperties: {type: string}}
        public_keys: {type: array, items: {type: string}}
    AgentPatch:
      type: object
      required: [version]
      properties:
        version: {type: integer}
        name: {type: string}
        description: {type: string}
        source_cidrs: {type: array, items: {type: string}}
        groups: {type: array, items: {type: string}}
        labels: {type: object, additionalProperties: {type: string}}
    AgentKey:
      type: object
      required: [id, agent_id, fingerprint, algorithm, public_key, state, created_at]
      properties:
        id: {type: string}
        agent_id: {type: string}
        fingerprint: {type: string}
        algorithm: {type: string}
        bits: {type: integer}
        public_key: {type: string}
        comment: {type: string}
        state: {type: string, enum: [active, revoked]}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        created_by: {type: string}
        revoked_at: {$ref: "#/components/schemas/Timestamp"}
        last_used_at: {$ref: "#/components/schemas/Timestamp"}
    Group:
      type: object
      required: [id, kind, name]
      properties: {id: {type: string}, kind: {type: string}, name: {type: string}}
    Server:
      type: object
      required: [id, kind, alias, display_name, enabled, groups, labels, version, created_at, updated_at, address_redacted]
      properties:
        id: {type: string}
        kind: {type: string, enum: [ssh, git], description: "ssh: a destination for shell and exec; git: a git host agents reach with plain git"}
        alias: {type: string}
        display_name: {type: string}
        description: {type: string}
        environment: {type: string}
        address: {type: string, description: "empty unless the caller has inventory.address.read"}
        port: {type: integer, description: "0 unless the caller has inventory.address.read"}
        address_redacted: {type: boolean}
        enabled: {type: boolean}
        host_ca_id: {type: string}
        host_ca_principals: {$ref: "#/components/schemas/StringList"}
        metadata: {$ref: "#/components/schemas/StringMap"}
        groups: {$ref: "#/components/schemas/StringList"}
        labels: {$ref: "#/components/schemas/StringMap"}
        version: {type: integer}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        updated_at: {$ref: "#/components/schemas/Timestamp"}
        active_host_identities: {type: integer}
        deleted_at: {allOf: [{$ref: "#/components/schemas/Timestamp"}], description: "Set when the server was deleted; alias is then the name it had."}
    ServerInput:
      type: object
      properties:
        version: {type: integer}
        kind: {type: string, enum: [ssh, git], description: "Set on create only (default ssh); it cannot change later."}
        alias: {type: string}
        display_name: {type: string}
        description: {type: string}
        environment: {type: string}
        address: {type: string}
        port: {type: integer}
        enabled: {type: boolean}
        metadata: {type: object, additionalProperties: {type: string}}
        groups: {type: array, items: {type: string}}
        labels: {type: object, additionalProperties: {type: string}}
    Role:
      type: object
      required: [id, server_id, alias, remote_user, capabilities, default_duration, max_duration, recording_mode, enabled, version]
      properties:
        id: {type: string}
        server_id: {type: string}
        alias: {type: string}
        display_name: {type: string}
        description: {type: string}
        remote_user: {type: string}
        capabilities: {$ref: "#/components/schemas/StringList"}
        default_duration: {type: integer, description: seconds}
        max_duration: {type: integer, description: seconds}
        max_concurrent: {type: integer}
        max_concurrent_per_agent: {type: integer}
        record_input: {type: boolean}
        recording_mode: {type: string}
        env_allow: {$ref: "#/components/schemas/StringList"}
        approval_channels: {$ref: "#/components/schemas/StringList"}
        restriction_notes: {type: string}
        retention_class: {type: string}
        labels: {$ref: "#/components/schemas/StringMap"}
        enabled: {type: boolean}
        version: {type: integer}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        updated_at: {$ref: "#/components/schemas/Timestamp"}
        git: {$ref: "#/components/schemas/GitRules"}
        approvals_required: {type: integer, description: "Distinct approvers needed (1-5). Above 1, policy auto-approval does not apply."}
        deleted_at: {allOf: [{$ref: "#/components/schemas/Timestamp"}], description: "Set when the role was deleted; alias is then the name it had."}
    GitRules:
      type: object
      description: >-
        What an access profile on a git remote covers. Repository patterns match the repository path without ".git",
        case-insensitively: * matches within one segment, ** across segments, ? one character, {a,b} alternatives.
        Push rules apply with the git-write capability; branch and tag patterns are relative to refs/heads/ and refs/tags/.
      required: [repos]
      properties:
        repos: {type: array, items: {type: string}}
        push:
          type: object
          properties:
            branches: {type: array, items: {type: string}, description: "Branches that may be created and updated."}
            protected_branches: {type: array, items: {type: string}, description: "Branches never changed, even when branches matches."}
            tags: {type: array, items: {type: string}, description: "Tags that may be created; existing tags are never moved or deleted."}
            allow_delete: {type: boolean, description: "Allow deleting branches that branches matches and protected_branches does not."}
            allow_force_push:
              type: boolean
              description: >-
                Allow moving a branch to a commit that does not descend from its current tip. When false (the default),
                every branch update must be provable as a fast-forward from the pushed commits.
    RoleInput:
      type: object
      properties:
        version: {type: integer}
        alias: {type: string}
        display_name: {type: string}
        description: {type: string}
        remote_user: {type: string}
        capabilities: {type: array, items: {type: string}}
        default_duration: {type: integer, description: seconds}
        max_duration: {type: integer, description: seconds}
        max_concurrent: {type: integer}
        max_concurrent_per_agent: {type: integer}
        record_input: {type: boolean}
        recording_mode: {type: string}
        env_allow: {type: array, items: {type: string}}
        approval_channels: {type: array, items: {type: string}}
        restriction_notes: {type: string}
        retention_class: {type: string}
        labels: {type: object, additionalProperties: {type: string}}
        enabled: {type: boolean}
        git: {$ref: "#/components/schemas/GitRules"}
        approvals_required: {type: integer, minimum: 1, maximum: 5}
    HostIdentity:
      type: object
      required: [id, server_id, algorithm, public_key, fingerprint, state, enrolled_via, created_at]
      properties:
        id: {type: string}
        server_id: {type: string}
        algorithm: {type: string}
        public_key: {type: string}
        fingerprint: {type: string}
        state: {type: string}
        enrolled_via: {type: string}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        created_by: {type: string}
        confirmed_at: {$ref: "#/components/schemas/Timestamp"}
        confirmed_by: {type: string}
    HostCA:
      type: object
      required: [id, name, public_key, fingerprint, max_validity, state]
      properties:
        id: {type: string}
        name: {type: string}
        public_key: {type: string}
        fingerprint: {type: string}
        max_validity: {type: integer, description: seconds}
        state: {type: string}
    LoginCredential:
      type: object
      required: [id, role_id, kind, algorithm, public_key, fingerprint, state, created_at, authorized_keys_line]
      properties:
        id: {type: string}
        role_id: {type: string}
        kind: {type: string}
        algorithm: {type: string}
        public_key: {type: string}
        fingerprint: {type: string}
        state: {type: string}
        probe_ok_at: {$ref: "#/components/schemas/Timestamp"}
        probe_error: {type: string}
        activated_at: {$ref: "#/components/schemas/Timestamp"}
        retire_after: {$ref: "#/components/schemas/Timestamp"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        created_by: {type: string}
        authorized_keys_line: {type: string}
    DestinationCollector:
      type: object
      required: [id, server_id, name, public_key, fingerprint, state, last_seq, created_at, created_by]
      properties:
        id: {type: string}
        server_id: {type: string}
        name: {type: string}
        public_key: {type: string}
        fingerprint: {type: string}
        state: {type: string, enum: [active, revoked]}
        last_seq: {type: integer}
        last_seen_at: {$ref: "#/components/schemas/Timestamp"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        created_by: {type: string}
        revoked_at: {$ref: "#/components/schemas/Timestamp"}
        revoked_by: {type: string}
        revoke_reason: {type: string}
    DestinationCollectorInput:
      type: object
      additionalProperties: false
      required: [server_id, name, public_key]
      properties:
        server_id: {type: string}
        name: {type: string, maxLength: 64}
        public_key: {type: string, maxLength: 512, description: "ssh-ed25519 key in authorized_keys format (hallpass-collector pubkey)"}
    DestinationRecord:
      type: object
      description: Destination-reported, never verified by HallPass. exe, argv and cwd are present only on the single-record endpoint and are untrusted text.
      required: [id, session_id, collector_id, record_ref, batch_seq, timeline_event_id, provenance, verified, correlation, confidence, after_session_end, reported_at, received_at]
      properties:
        id: {type: string}
        session_id: {type: string}
        connection_id: {type: string}
        collector_id: {type: string}
        record_ref: {type: string}
        batch_seq: {type: integer}
        timeline_event_id: {type: string}
        provenance: {type: string}
        verified: {type: boolean}
        correlation: {type: string}
        confidence: {type: string}
        after_session_end: {type: boolean}
        reported_at: {$ref: "#/components/schemas/Timestamp"}
        received_at: {$ref: "#/components/schemas/Timestamp"}
        purged: {type: boolean}
        exe: {type: string}
        argv: {type: array, items: {type: string}}
        cwd: {type: string}
        truncated: {type: boolean}
    UserCA:
      type: object
      required: [id, name, algorithm, public_key, fingerprint, external, state]
      properties:
        id: {type: string}
        name: {type: string}
        algorithm: {type: string}
        public_key: {type: string}
        fingerprint: {type: string}
        external: {type: boolean}
        state: {type: string}
    GatewayHostKey:
      type: object
      required: [id, algorithm, public_key, fingerprint, state, created_at]
      properties:
        id: {type: string}
        algorithm: {type: string}
        public_key: {type: string}
        fingerprint: {type: string}
        state: {type: string}
        created_at: {$ref: "#/components/schemas/Timestamp"}
    Selector:
      type: object
      description: Subject, target, role or operator selector (PLAN §9). An empty selector matches nothing.
      additionalProperties: true
    AgentOwners:
      type: object
      required: [agent_id, owners]
      properties: {agent_id: {type: string}, owners: {type: array, items: {type: string}}}
    AgentOwnersInput:
      type: object
      required: [owners]
      additionalProperties: false
      properties: {owners: {type: array, maxItems: 64, items: {type: string}}}
    SelfApprovalSetting:
      type: object
      required: [prohibit_self_approval]
      additionalProperties: false
      properties: {prohibit_self_approval: {type: boolean}}
    PolicyPreviewInput:
      type: object
      additionalProperties: false
      properties:
        rule: {$ref: "#/components/schemas/PolicyRule", description: "Proposed rule: replaces the rule with the same id, or is added when id is empty."}
        remove_rule_id: {type: string, description: Preview the removal of this rule.}
        agent_id: {type: string}
        server_id: {type: string}
    PolicyPreview:
      type: object
      required: [before, after]
      properties:
        before: {$ref: "#/components/schemas/EffectiveAccess"}
        after: {$ref: "#/components/schemas/EffectiveAccess"}
    PolicyRule:
      type: object
      required: [name, effect, subjects, targets, roles, enabled]
      properties:
        id: {type: string, readOnly: true}
        name: {type: string}
        description: {type: string}
        effect: {type: string, enum: [allow, deny]}
        level: {type: string, enum: [visible, requestable, auto_approve]}
        subjects: {$ref: "#/components/schemas/Selector"}
        targets: {$ref: "#/components/schemas/Selector"}
        roles: {$ref: "#/components/schemas/Selector"}
        max_duration: {type: integer, description: seconds}
        auto_max_duration: {type: integer, description: seconds}
        require_reason: {type: boolean, default: true, description: Omitted means true (SR-33).}
        enabled: {type: boolean}
        version: {type: integer}
    ApproverRule:
      type: object
      required: [name, operators, targets, roles, enabled]
      properties:
        id: {type: string, readOnly: true}
        name: {type: string}
        description: {type: string}
        operators: {$ref: "#/components/schemas/Selector"}
        targets: {$ref: "#/components/schemas/Selector"}
        roles: {$ref: "#/components/schemas/Selector"}
        max_duration: {type: integer, description: seconds}
        enabled: {type: boolean}
        version: {type: integer}
    EffectiveAccess:
      type: object
      required: [policy_version, items]
      properties:
        policy_version: {type: integer}
        items:
          type: array
          items:
            type: object
            required: [agent_id, server_id, role_id, level]
            properties:
              agent_id: {type: string}
              agent_name: {type: string}
              server_id: {type: string}
              server_alias: {type: string}
              role_id: {type: string}
              role_alias: {type: string}
              level: {type: string}
              require_reason: {type: boolean}
              max_duration: {type: integer, description: seconds}
              auto_max_duration: {type: integer, description: seconds}
              rules: {type: array, items: {type: string}}
    AccessRequest:
      type: object
      required: [id, agent_id, server_id, role_id, requested_duration, state, policy_version, created_at, expires_at, has_reason,
        approvals_required, approvals]
      properties:
        id: {type: string}
        agent_id: {type: string}
        agent_key_id: {type: string}
        server_id: {type: string}
        role_id: {type: string}
        requested_duration: {type: integer, description: seconds}
        state: {type: string, enum: [pending, approved, denied, expired, canceled]}
        state_reason: {type: string}
        policy_version: {type: integer}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
        decided_at: {$ref: "#/components/schemas/Timestamp"}
        has_reason: {type: boolean}
        reason: {type: [string, "null"], description: "untrusted agent text; only with requests.reason.read"}
        approvals_required: {type: integer, description: "Distinct approvers the role needs (1 unless the role asks for more)."}
        approvals:
          type: array
          description: Approvals recorded so far when the role needs several approvers.
          items:
            type: object
            required: [operator_id, channel, duration, approved_at]
            properties:
              operator_id: {type: string}
              channel: {type: string}
              duration: {type: integer, description: seconds}
              approved_at: {$ref: "#/components/schemas/Timestamp"}
    RequestPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AccessRequest"}}
        next_cursor: {type: [string, "null"]}
    Decision:
      type: object
      required: [request]
      properties:
        request: {$ref: "#/components/schemas/AccessRequest"}
        grant: {oneOf: [{$ref: "#/components/schemas/Grant"}, {type: "null"}]}
    Grant:
      type: object
      required: [id, request_id, agent_id, server_id, role_id, remote_user, capabilities, starts_at, expires_at, state]
      properties:
        id: {type: string}
        request_id: {type: string}
        decision_id: {type: string}
        agent_id: {type: string}
        server_id: {type: string}
        role_id: {type: string}
        remote_user: {type: string}
        capabilities: {$ref: "#/components/schemas/StringList"}
        policy_version: {type: integer}
        starts_at: {$ref: "#/components/schemas/Timestamp"}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
        state: {type: string, enum: [active, expired, revoked]}
        ended_at: {$ref: "#/components/schemas/Timestamp"}
        end_reason: {type: string}
        session_id: {type: string}
    GrantPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Grant"}}
        next_cursor: {type: [string, "null"]}
    AccessSession:
      type: object
      required: [id, grant_id, state, opened_at, agent_id, server_id, role_id, remote_user, grant_expires_at, grant_state, retention_class]
      properties:
        id: {type: string}
        grant_id: {type: string}
        state: {type: string, enum: [open, closing, closed]}
        opened_at: {$ref: "#/components/schemas/Timestamp"}
        closed_at: {$ref: "#/components/schemas/NullableTimestamp"}
        close_reason: {type: string}
        retention_class: {type: string}
        delete_after: {$ref: "#/components/schemas/NullableTimestamp"}
        agent_id: {type: string}
        server_id: {type: string}
        role_id: {type: string}
        remote_user: {type: string}
        grant_expires_at: {$ref: "#/components/schemas/Timestamp"}
        grant_state: {type: string}
        channels_total: {type: integer}
        channels_live: {type: integer}
    AccessSessionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AccessSession"}}
        next_cursor: {type: [string, "null"]}
    TimelineEvent:
      type: object
      required: [id, type, at, data]
      properties:
        id: {type: string}
        seq: {type: [integer, "null"]}
        type: {type: string}
        at: {$ref: "#/components/schemas/Timestamp"}
        connection_id: {type: string}
        channel_id: {type: string}
        segment_id: {type: string}
        data: {type: object}
    TimelinePage:
      type: object
      required: [items, next_after_seq]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/TimelineEvent"}}
        next_after_seq: {type: [integer, "null"]}
    Channel:
      type: object
      required: [id, session_id, connection_id, agent_id, role_id, kind, pty, state, opened_at]
      properties:
        id: {type: string}
        session_id: {type: string}
        connection_id: {type: string}
        grant_id: {type: string}
        agent_id: {type: string}
        role_id: {type: string}
        kind: {type: string}
        pty: {type: boolean}
        state: {type: string}
        opened_at: {$ref: "#/components/schemas/Timestamp"}
        closed_at: {$ref: "#/components/schemas/NullableTimestamp"}
        close_reason: {type: string}
        close_detail:
          type: string
          description: >-
            Classified failure detail for failed or gateway-ended channels (for example "destination host key changed",
            "destination refused the login credential", "destination unreachable (timeout)"). Never contains addresses.
        gateway_exit_code: {type: [integer, "null"], description: Gateway exit code (80-90) when the gateway ended the channel.}
        server_id: {type: string, description: Server of the channel's grant (live activities).}
        grant_expires_at: {$ref: "#/components/schemas/NullableTimestamp", description: "Grant expiry for live channels: the remaining time is grant_expires_at minus the corrected server clock (HP-SES-005)."}
        exit_status: {type: [integer, "null"]}
        exit_signal: {type: string}
        git_service: {type: string, enum: [git-upload-pack, git-receive-pack, git-upload-archive], description: Git operation on a git remote.}
        git_repo: {type: string, description: Normalized repository of a git operation.}
        subsystem: {type: string, enum: [sftp], description: "SSH subsystem of a file transfer (scp or sftp)."}
    SSHBan:
      type: object
      required: [id, address, failures, reason, banned_at, expires_at]
      properties:
        id: {type: string}
        address: {type: string, description: Banned source (IPv4 address or IPv6 /64 prefix).}
        failures: {type: integer, description: Failed SSH connections in the window that triggered the ban.}
        reason: {type: string}
        offense: {type: integer, description: How many times this source has been banned (the duration doubles each time).}
        banned_at: {$ref: "#/components/schemas/Timestamp"}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
    Segment:
      type: object
      required: [id, session_id, channel_id, ordinal, state, opened_at]
      properties:
        id: {type: string}
        session_id: {type: string}
        channel_id: {type: string}
        ordinal: {type: integer}
        state: {type: string}
        records: {type: [integer, "null"]}
        bytes: {type: [integer, "null"]}
        first_seq: {type: [integer, "null"]}
        last_seq: {type: [integer, "null"]}
        end_reason: {type: string}
        opened_at: {$ref: "#/components/schemas/Timestamp"}
        finalized_at: {$ref: "#/components/schemas/NullableTimestamp"}
        verify_result: {type: string}
    RecordPage:
      type: object
      required: [segment_id, records, next_seq, more, complete, incomplete]
      properties:
        segment_id: {type: string}
        records:
          type: array
          items:
            type: object
            required: [type, seq, time, stream, data]
            properties:
              type: {type: string, description: versioned record type, e.g. terminal.output@1}
              seq: {type: integer}
              time: {$ref: "#/components/schemas/Timestamp"}
              offset_ms: {type: integer}
              stream: {type: string}
              data: {type: string, description: base64 payload (untrusted bytes)}
        next_seq: {type: integer}
        more: {type: boolean}
        complete: {type: boolean}
        incomplete: {type: boolean}
    SessionExport:
      type: object
      required: [session_id, exported_at, truncated, segments]
      properties:
        session_id: {type: string}
        exported_at: {$ref: "#/components/schemas/Timestamp"}
        truncated: {type: boolean}
        segments:
          type: array
          items:
            type: object
            required: [segment_id, channel_id, ordinal, state, records]
            properties:
              segment_id: {type: string}
              channel_id: {type: string}
              ordinal: {type: integer}
              state: {type: string}
              complete: {type: boolean}
              records: {$ref: "#/components/schemas/RecordPage/properties/records"}
    AuditEvent:
      type: object
      required: [id, seq, at, actor_type, action, outcome, details]
      properties:
        id: {type: string}
        seq: {type: integer}
        at: {$ref: "#/components/schemas/Timestamp"}
        actor_type: {type: string}
        actor_id: {type: string}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        outcome: {type: string}
        source_ip: {type: string}
        correlation_id: {type: string}
        details: {type: object}
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AuditEvent"}}
        next_cursor: {type: [string, "null"]}
    AuditVerify:
      type: object
      required: [ok, events]
      properties: {ok: {type: boolean}, events: {type: integer}, problem: {type: string}}
    OIDCProvider:
      type: object
      required: [id, slug, display_name, issuer, client_id, has_client_secret, scopes, provisioning, enabled, version]
      properties:
        id: {type: string}
        slug: {type: string}
        display_name: {type: string}
        issuer: {type: string}
        client_id: {type: string}
        has_client_secret: {type: boolean}
        scopes: {type: array, items: {type: string}}
        groups_claim: {type: string}
        provisioning: {type: string, enum: [preprovisioned, jit]}
        jit: {type: object}
        allow_private_network: {type: boolean}
        allow_cross_origin_endpoints: {type: boolean}
        ca_bundle_pem: {type: string}
        stepup_fallback: {type: string}
        acr_values: {$ref: "#/components/schemas/StringList"}
        end_session_enabled: {type: boolean}
        enabled: {type: boolean}
        test_login_ok_at: {$ref: "#/components/schemas/NullableTimestamp"}
        version: {type: integer}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        updated_at: {$ref: "#/components/schemas/Timestamp"}
        redirect_uri: {type: string, description: the exact redirect URI to register at the provider}
    OIDCProviderInput:
      type: object
