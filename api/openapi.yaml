openapi: 3.1.0
info:
  title: HallPass operator API
  version: "1.0.0"
  description: |
    The operator API behind the HallPass web UI (PLAN §8). JSON only; errors are RFC 9457 problem details.
    Authentication uses the `__Host-hp_session` cookie. Mutations require the `X-CSRF-Token` header and a same-origin
    `Origin`. Automation (Terraform, scripts) uses an API token as a bearer token instead, on the operations marked
    `x-token`. Changes within v1 are additive only (HP-API-002).

    Vendor extensions on every operation:
    - `x-permission`: the single RBAC permission checked server-side (`public`, `session`, `session.limited` or a
      permission from the matrix in PLAN §12.5).
    - `x-reauth`: recent authentication (5 minutes) is required (HP-AUTH-014); otherwise `reauth_required`.
    - `x-mfa`: password sessions must have completed MFA recently; otherwise `mfa_required`.
    - `x-idempotency-key`: the `Idempotency-Key` header is honored for 24 h per operator (HP-API-006).
    - `x-stream`: Server-Sent Events. `x-redirect`: a browser redirect, not JSON.
    - `x-token`: automation tokens (`Authorization: Bearer hallpass_at_…`) may call it. Every other operation needs a
      browser session. Token requests skip the Origin and CSRF checks and the recent-authentication requirement.

    Durations are integer seconds. Timestamps are RFC 3339 UTC. Destination addresses, ports and host-key details
    are returned only with `inventory.address.read` (HP-SRV-010).
servers:
  - url: /
tags:
  - {name: auth}
  - {name: me}
  - {name: operators}
  - {name: agents}
  - {name: inventory}
  - {name: credentials}
  - {name: policy}
  - {name: access}
  - {name: sessions}
  - {name: audit}
  - {name: sso}
  - {name: integrations}
  - {name: system}
  - {name: live}

paths:
  # ---------------------------------------------------------------- auth
  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      x-permission: public
      summary: Login modes and enabled SSO providers.
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/AuthConfig"}}}}
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      x-permission: public
      summary: Password login. Sets the session cookie; the session is limited until MFA completes.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LoginRequest"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/LoginResult"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa:
    post:
      operationId: verifyMFA
      tags: [auth]
      x-permission: session.limited
      summary: Complete the second factor of a limited password session (TOTP or recovery code); rotates the session.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CodeRequest"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      x-permission: session.limited
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/LogoutResult"}}}}
  /api/v1/auth/reauth:
    post:
      operationId: reauth
      tags: [auth]
      x-permission: session
      summary: Re-authenticate a password or break-glass session (password plus TOTP when enrolled).
      description: Wrong passwords and codes are throttled per account and audited like logins.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ReauthRequest"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/reauth/totp:
    post:
      operationId: reauthTOTP
      tags: [auth]
      x-permission: session
      summary: Step-up fallback for SSO sessions whose provider cannot prove a fresh login.
      description: Only for SSO sessions whose provider is configured with `stepup_fallback = local_totp`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CodeRequest"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrap
      tags: [auth]
      x-permission: public
      summary: Create the first administrator with the one-time setup token.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/BootstrapRequest"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Operator"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [auth]
      x-permission: public
      parameters: [{$ref: "#/components/parameters/Token"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AcceptInvitationRequest"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Operator"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/reset/{token}:
    post:
      operationId: resetPassword
      tags: [auth]
      x-permission: public
      parameters: [{$ref: "#/components/parameters/Token"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PasswordRequest"}}}
      responses:
        "204": {description: password changed}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/recover:
    post:
      operationId: recoverLogin
      tags: [auth]
      x-permission: public
      summary: Redeem a break-glass recovery token printed by `hallpass admin recover` (HP-AUTH-016).
      description: |
        Single use, valid for 30 minutes, throttled per source and audited (`breakglass.login`, `breakglass.login.failed`).
        Redeeming revokes the operator's other sessions and removes their TOTP factor and recovery codes. The returned
        break-glass session is limited until a new factor is enrolled (`must_enroll`) when policy requires MFA. For
        accounts with a local password a single-use password reset link (`password_reset`, 1 hour) is returned; using it
        ends every session of the operator, including this one. Works while password login is disabled.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RecoverRequest"}}}
      responses:
        "200": {description: break-glass session cookie set, content: {application/json: {schema: {$ref: "#/components/schemas/RecoverResult"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /auth/oidc/{provider}/start:
    get:
      operationId: oidcStart
      tags: [sso]
      x-permission: public
      x-redirect: true
      summary: Redirect to the identity provider (purpose login, stepup, test or link).
      description: |
        `test` needs a full session with `auth.settings`. Self-service `link` (without `link_token`) needs recent
        authentication with MFA (HP-AUTH-014); failures redirect to `/login?sso_error=<code>`.
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string}}
        - {name: purpose, in: query, schema: {type: string, enum: [login, stepup, test, link], default: login}}
        - {name: return_to, in: query, schema: {type: string}}
        - {name: link_token, in: query, schema: {type: string}}
      responses:
        "302": {description: redirect to the provider}
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [sso]
      x-permission: public
      x-redirect: true
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "303": {description: redirect into the UI}

  # ---------------------------------------------------------------- me
  /api/v1/me:
    get:
      operationId: getMe
      tags: [me]
      x-permission: session.limited
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
  /api/v1/me/sessions:
    get:
      operationId: listMySessions
      tags: [me]
      x-permission: session
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/WebSession"}}}}}}}
  /api/v1/me/sessions/{id}:
    delete:
      operationId: revokeMySession
      tags: [me]
      x-permission: session
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "204": {description: revoked}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/me/password:
    post:
      operationId: changeMyPassword
      tags: [me]
      x-permission: session
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ChangePasswordRequest"}}}
      responses:
        "204": {description: changed}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/me/mfa/totp:
    post:
      operationId: beginTOTP
      tags: [me]
      x-permission: session.limited
      summary: Start TOTP enrollment (allowed while enrollment is required).
      description: |
        The new secret is pending (15 minutes) and does not replace a confirmed factor until `confirmTOTP` succeeds.
        A limited session may call this only while enrollment is required (`needs_enroll`); a session that still has to
        verify its existing factor is refused. On a full session, adding a first factor requires recent authentication
        (`reauth_required`) and replacing a factor requires recent authentication with MFA.
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/TOTPEnrollment"}}}}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: disableTOTP
      tags: [me]
      x-permission: session
      x-reauth: true
      x-mfa: true
      responses:
        "204": {description: disabled}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/me/mfa/totp/confirm:
    post:
      operationId: confirmTOTP
      tags: [me]
      x-permission: session.limited
      summary: Confirm the pending TOTP enrollment with a code from the new secret.
      description: |
        Same session rules as `beginTOTP`; wrong codes share the MFA throttle and are audited. Enrollment never
        refreshes the authentication time: a limited session that had to enroll stays limited and finishes sign-in with
        `verifyMFA` and a later code. A full session is rotated (new cookie and CSRF token, MFA time set). Other
        sessions of the operator are revoked.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CodeRequest"}}}
      responses:
        "200": {description: recovery codes, shown once, content: {application/json: {schema: {$ref: "#/components/schemas/RecoveryCodes"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/me/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [me]
      x-permission: session
      x-reauth: true
      x-mfa: true
      responses:
        "200": {description: new codes, shown once, content: {application/json: {schema: {$ref: "#/components/schemas/RecoveryCodes"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/me/identities:
    get:
      operationId: listMyIdentities
      tags: [me]
      x-permission: session
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/Identity"}}}}}}}

  # ---------------------------------------------------------------- operators
  /api/v1/operators:
    get:
      operationId: listOperators
      tags: [operators]
      x-permission: operators.manage
      x-token: true
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/Operator"}}}}}}}
    post:
      operationId: createOperator
      tags: [operators]
      x-permission: operators.manage
      x-reauth: true
      x-mfa: true
      x-idempotency-key: true
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/OperatorCreate"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Operator"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/operators/{id}:
    get:
      operationId: getOperator
      tags: [operators]
      x-permission: operators.manage
      x-token: true
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Operator"}}}}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateOperator
      tags: [operators]
      x-permission: operators.manage
      x-reauth: true
      x-mfa: true
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/OperatorPatch"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Operator"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/operators/{id}/reset-token:
    post:
      operationId: issueResetToken
      tags: [operators]
      x-permission: operators.manage
      x-reauth: true
      x-mfa: true
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: single-use token, shown once, content: {application/json: {schema: {$ref: "#/components/schemas/OneTimeToken"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/operators/{id}/sessions:
    get:
      operationId: listOperatorSessions
      tags: [operators]
      x-permission: operators.manage
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/WebSession"}}}}}}}
    delete:
      operationId: revokeOperatorSessions
      tags: [operators]
      x-permission: operators.manage
      x-reauth: true
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "204": {description: revoked}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/operators/{id}/identities:
    get:
      operationId: listOperatorIdentities
      tags: [operators]
      x-permission: operators.manage
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/Identity"}}}}}}}
    post:
      operationId: linkOperatorIdentity
      tags: [operators]
      x-permission: operators.manage
      x-reauth: true
      x-mfa: true
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/IdentityLink"}}}
      responses:
        "204": {description: linked}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: unlinkOperatorIdentity
      tags: [operators]
      x-permission: operators.manage
      x-reauth: true
      parameters:
        - {$ref: "#/components/parameters/ID"}
        - {name: issuer, in: query, required: true, schema: {type: string}}
        - {name: subject, in: query, required: true, schema: {type: string}}
      responses:
        "204": {description: unlinked}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/operators/{id}/link-invite:
    post:
      operationId: issueLinkInvite
      tags: [operators]
      x-permission: operators.manage
      x-reauth: true
      x-mfa: true
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [provider_id], properties: {provider_id: {type: string}}}}}
      responses:
        "200": {description: single-use link invitation, content: {application/json: {schema: {$ref: "#/components/schemas/OneTimeToken"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/invitations:
    get:
      operationId: listInvitations
      tags: [operators]
      x-permission: operators.manage
      summary: Pending (unused, unexpired) invitations. Tokens are never returned; the id is the token's HMAC (HP-AUTH-011).
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/Invitation"}}}}}}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: createInvitation
      tags: [operators]
      x-permission: operators.manage
      x-reauth: true
      x-mfa: true
      x-idempotency-key: true
      description: |
        The token is returned once and never stored in plaintext: a replay with the same `Idempotency-Key` is
        answered `409 conflict` instead of repeating the token (AS-7). Create a new invitation if the response was lost.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/InvitationCreate"}}}
      responses:
        "200": {description: single-use invitation token, content: {application/json: {schema: {$ref: "#/components/schemas/OneTimeToken"}}}}
        default: {$ref: "#/components/responses/Problem"}

  # ---------------------------------------------------------------- API tokens
  /api/v1/api-tokens:
    get:
      operationId: listAPITokens
      tags: [operators]
      x-permission: operators.manage
      summary: Automation tokens (metadata only; the token itself is shown once at creation).
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/APIToken"}}}}}}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: createAPIToken
      tags: [operators]
      x-permission: operators.manage
      x-reauth: true
      x-mfa: true
      x-idempotency-key: true
      summary: >-
        Issue an automation token for yourself with one of your roles. It is shown once. It works only while you are
        enabled and still hold the role, and only on operations marked x-token.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/APITokenInput"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/APITokenCreated"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/api-tokens/{id}:
    delete:
      operationId: revokeAPIToken
      tags: [operators]
      x-permission: operators.manage
      x-reauth: true
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/APIToken"}}}}
        default: {$ref: "#/components/responses/Problem"}
  # ---------------------------------------------------------------- agents
  /api/v1/invitations/{id}:
    delete:
      operationId: revokeInvitation
      tags: [operators]
      x-permission: operators.manage
      x-reauth: true
      summary: Revoke a pending invitation so it can no longer be accepted (audited).
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "204": {description: revoked}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/agents:
    get:
      operationId: listAgents
      tags: [agents]
      x-permission: inventory.read
      x-token: true
      parameters:
        - {name: include_deleted, in: query, schema: {type: boolean}, description: "Also return deleted agents (deleted_at set), for naming them in history."}
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/Agent"}}}}}}}
    post:
      operationId: createAgent
      tags: [agents]
      x-permission: inventory.write
      x-token: true
      x-idempotency-key: true
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AgentCreate"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Agent"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      x-permission: inventory.read
      x-token: true
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/AgentDetail"}}}}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateAgent
      tags: [agents]
      x-permission: inventory.write
      x-token: true
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AgentPatch"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Agent"}}}}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deleteAgent
      tags: [agents]
      x-permission: inventory.write
      x-token: true
      x-reauth: true
      summary: >-
        Delete an agent: its access ends, its keys are revoked for good, and its pending requests are canceled. The
        record stays for history (deleted_at set) and the name can be reused.
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "204": {description: deleted}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/agents/{id}/disable:
    post:
      operationId: disableAgent
      tags: [agents]
      x-permission: inventory.write
      x-token: true
      x-idempotency-key: true
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody:
        content: {application/json: {schema: {$ref: "#/components/schemas/ReasonRequest"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Agent"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/agents/{id}/enable:
    post:
      operationId: enableAgent
      tags: [agents]
      x-permission: inventory.write
      x-token: true
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Agent"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/agents/{id}/keys:
    post:
      operationId: addAgentKey
      tags: [agents]
      x-permission: inventory.write
      x-token: true
      x-idempotency-key: true
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [public_key], properties: {public_key: {type: string, description: authorized_keys line}}}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/AgentKey"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/agents/{id}/keys/{kid}/revoke:
    post:
      operationId: revokeAgentKey
      tags: [agents]
      x-permission: inventory.write
      x-token: true
      x-idempotency-key: true
      parameters:
        - {$ref: "#/components/parameters/ID"}
        - {name: kid, in: path, required: true, schema: {type: string}}
      requestBody:
        content: {application/json: {schema: {$ref: "#/components/schemas/ReasonRequest"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/AgentKey"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/agents/{id}/owners:
    get:
      operationId: getAgentOwners
      tags: [agents, policy]
      x-permission: policy.read
      x-token: true
      summary: Operators who own the agent; owners may not approve its requests while self-approval is prohibited (HP-POL-012).
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/AgentOwners"}}}}
        default: {$ref: "#/components/responses/Problem"}
    put:
      operationId: setAgentOwners
      tags: [agents, policy]
      x-permission: policy.write
      x-token: true
      x-reauth: true
      x-mfa: true
      parameters: [{$ref: "#/components/parameters/ID"}]
