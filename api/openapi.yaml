      properties:
        version: {type: integer}
        slug: {type: string}
        display_name: {type: string}
        issuer: {type: string}
        client_id: {type: string}
        client_secret: {type: string, writeOnly: true}
        scopes: {type: array, items: {type: string}}
        groups_claim: {type: string}
        provisioning: {type: string}
        jit: {type: object}
        allow_private_network: {type: boolean}
        allow_cross_origin_endpoints: {type: boolean}
        ca_bundle_pem: {type: string}
        stepup_fallback: {type: string}
        acr_values: {type: array, items: {type: string}}
        end_session_enabled: {type: boolean}
        enabled: {type: boolean}
    OIDCMapping:
      type: object
      required: [id, provider_id, group_value]
      properties:
        id: {type: string}
        provider_id: {type: string}
        group_value: {type: string}
        role: {type: string}
        group_id: {type: string}
        created_at: {$ref: "#/components/schemas/Timestamp"}
    OIDCTestResult:
      type: object
      required: [claims, would_provision, mapped_roles, mapped_groups, effective_roles]
      properties:
        claims: {type: object}
        linked_operator_id: {type: string}
        would_provision: {type: boolean}
        provision_reason: {type: string}
        mapped_roles: {type: array, items: {type: string}}
        mapped_groups: {type: array, items: {type: string}}
        effective_roles: {type: array, items: {type: string}}
    Integration:
      type: object
      required: [id, provider, name, config, secrets_set, enabled, version, webhook_path]
      properties:
        id: {type: string}
        provider: {type: string, enum: [slack, telegram]}
        name: {type: string}
        config: {type: object}
        secrets_set: {type: array, items: {type: string}, description: names of stored secrets (values are write-only)}
        enabled: {type: boolean}
        version: {type: integer}
