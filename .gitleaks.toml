title = "hallpass gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Planning docs mention secret names, not values"
paths = [
  '''docs/PROMPT\.md''',
]
# Exact test literal: an idempotency-key fixture in the grammar tests (also marked gitleaks:allow inline).
# Slack test fixtures (internal/notify/slack): an obviously fake bot token, Slack's published documentation example
# signing secret (api.slack.com "Verifying requests"), and a made-up test secret. None is a real credential.
regexes = [
  '''abc\.DEF_12-3''',
  '''xoxb-123456789012-SECRETSECRETSECRET''',
  '''8f742231b10e8888abcd99yyyzzz85a5''',
  '''test-signing-secret-0123456789abcdef''',
  # An algorithm name after the word "key" in docs (generic-api-key false positive in THREAT_MODEL T-24), not a secret.
  '''^ChaCha20-Poly1305$''',
  # A hallpass-api invocation ID fixture (cmd/hallpass-api tests, commit 9f629c1), not a secret.
  '''^inv_0123456789abcdef(gh)?$''',
]
